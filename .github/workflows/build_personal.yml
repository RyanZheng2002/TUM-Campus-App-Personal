name: Build personal Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_personalBuild: 'true'
      CAMPUS_PERSONAL_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --dart-define=PERSONAL_BUILD=true
      - uses: actions/upload-artifact@v4
        with:
          name: campus-personal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
